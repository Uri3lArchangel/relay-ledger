[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "relayledger"
version = "0.1.0"
description = "Crash-aware PostgreSQL webhook delivery laboratory"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.package-data]
relayledger = ["schema.sql"]

[tool.setuptools.packages.find]
include = ["relayledger*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

